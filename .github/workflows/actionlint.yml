#
# The github-pr-review reporter of reviewdog skips the check outside a pull
# request and still reports success. Other events use the local reporter,
# which prints the findings and fails the job.
---
name: actionlint
'on':
  pull_request:
    paths: &paths
      - .github/workflows/**
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@v1.81.1
        with:
          fail_level: error
          filter_mode: nofilter
          reporter: >-
            ${{ github.event_name == 'pull_request'
            && 'github-pr-review' || 'local' }}
