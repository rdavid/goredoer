# SPDX-FileCopyrightText: 2023-2026 David Rabkin
# SPDX-License-Identifier: 0BSD
#
# The Trivy scan runs against the pushed digest rather than a local image:
# buildx keeps a multi-platform build out of the local Docker store, so
# there is nothing to load and scan before the push. The ignore-unfixed
# flag skips base-image CVEs with no available patch, which would
# otherwise fail every run for issues nobody can act on. The scan runs
# twice: once to upload a SARIF report to the Security tab regardless of
# outcome, once to actually fail the workflow on findings, because a step
# that exits non-zero skips the upload that follows it. The release step
# runs last so a failed scan blocks it, and it publishes against the tag
# that triggered the workflow with an auto-generated changelog body.
---
name: publish
'on':
  push:
    tags:
      - v*
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY: ghcr.io
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            maintainer=David Rabkin
            org.opencontainers.image.description=Includes the Goredo utility
            org.opencontainers.image.licenses=0BSD
            org.opencontainers.image.source=https://github.com/rdavid/goredoer
            org.opencontainers.image.title=Goredoer
            org.opencontainers.image.vendor=David Rabkin
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},priority=901
      - uses: docker/build-push-action@v7.4.0
        id: build
        with:
          context: .
          file: Containerfile
          labels: ${{ steps.meta.outputs.labels }}
          platforms: "\
            linux/386,\
            linux/amd64,\
            linux/arm/v6,\
            linux/arm/v7,\
            linux/arm64,\
            linux/ppc64le,\
            linux/s390x"
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          format: sarif
          ignore-unfixed: true
          image-ref: "\
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\
            @${{ steps.build.outputs.digest }}"
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v4.38.1
        with:
          sarif_file: trivy-results.sarif
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: '1'
          ignore-unfixed: true
          image-ref: "\
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\
            @${{ steps.build.outputs.digest }}"
          severity: CRITICAL,HIGH
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
