#
# The workflow has limitations -- Ubuntu lacks a redo package, and macOS
# cannot run containers natively. To compensate, the Linux job smoke-tests
# the built image by running goredo -symlinks, the same invocation the
# README's Usage section documents. It also builds goredo from the tarball
# the Containerfile pins, reading the version and checksum from there, so
# both jobs run the lint target with a working redo. The build sets
# GOTOOLCHAIN to the Go version of the builder image, so every Ubuntu
# release compiles with the same toolchain instead of the one the runner
# ships. The Linux job calls the preinstalled buildah directly, so it fits
# in a single step.
---
name: test
'on':
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: sh
jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: |
          buildah build --file Containerfile --tag goredoer:latest .
          ctr=$(buildah from goredoer:latest)
          buildah run "$ctr" /goredo -symlinks
          buildah rm "$ctr"
          ver=$(sed -n 's/^[[:space:]]*VER=\(.*\)/\1/p' Containerfile)
          sha=$(sed -n 's/^[[:space:]]*SHA=\([0-9a-f]*\).*/\1/p' Containerfile)
          gov=$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine.*/\1/p' Containerfile)
          nme=goredo-$ver.tar.zst
          cd "$RUNNER_TEMP"
          curl \
            --fail \
            --location \
            --remote-name \
            --show-error \
            --silent \
            http://www.goredo.stargrave.org/download/"$nme"
          printf '%s  %s' "$sha" "$nme" | sha256sum --check --status
          mkdir bin src
          zstd --decompress < "$nme" |
            tar \
              --directory src \
              --extract \
              --file - \
              --strip-components=2 \
              goredo-"$ver"/src
          (
            cd src
            GOTOOLCHAIN=go$gov go build -mod=vendor -o ../bin/goredo
            cd ../bin
            ./goredo -symlinks
          )
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          rel=0.9.20261111
          src=https://github.com/rdavid/shellbase/archive/refs/tags
          curl \
            --fail \
            --location \
            --show-error \
            --silent \
            "$src/v$rel.tar.gz" |
            sudo tar \
              --directory /usr/local/bin \
              --extract \
              --gzip \
              --strip-components=2 \
              shellbase-"$rel"/lib/base.sh
      - if: runner.os == 'macOS'
        run: |
          brew install \
            rdavid/tap/goredo \
            rdavid/tap/shellbase
      - run: redo -xx lint
