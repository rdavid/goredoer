---
name: zizmor
'on':
  pull_request:
    paths: &paths
      - .github/**
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP"/venv
          "$RUNNER_TEMP"/venv/bin/pip install \
            --quiet \
            --requirement .github/zizmor/requirements.txt
          "$RUNNER_TEMP"/venv/bin/zizmor .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
